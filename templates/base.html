{% load static %}
{% load i18n %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{% endblock %} سامانه یادبود مجازی</title>
    <link rel="stylesheet" href="{% static 'root/bs/css/bootstrap.min.css' %}">
    {% block head %}{% endblock head %}
    <link rel="stylesheet" href="{% static 'root/css/basebody.css' %}"/>
    {% include 'partials/navbar.html' %}
</head>

<body dir="ltr" class="bkg">
{% include 'partials/messages.html' %}
<div class="container-fluid">
    {% block body %}
    {% endblock body %}
</div>
<br>

<script src="{% static 'root/bs/js/jquery-3.5.1.min.js' %}"></script>
<script src="{% static 'root/bs/js/popper.min.js' %}"></script>
<script src="{% static 'root/bs/js/bootstrap.min.js' %}"></script>
{% include 'partials/footer.html' %}
</body>
</html>
