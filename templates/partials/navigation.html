{% load i18n %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target=".dual-nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="navbar-collapse collapse dual-nav w-50 order-1 order-md-0">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link pl-0" href="{% url 'memorial:home' %}">Home <span
                            class="sr-only">{% translate "Home Page" %}</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'memorial:home' %}">{% translate "Option-1" %}</a>

                <li class="nav-item">

                </li>
            </ul>
        </div>
        <a href="/" class="navbar-brand mx-auto d-block text-center order-0 order-md-1 w-25">
            <b><span id="show_time_1" style="font-size:18px;font-family:tahoma,arial;">
                                <script language="JavaScript">
                                function show_time_1() {
                                    d = new Date();
                                    H = d.getHours();
                                    H = (H < 10) ? "0" + H : H;
                                    i = d.getMinutes();
                                    i = (i < 10) ? "0" + i : i;
                                    s = d.getSeconds();
                                    s = (s < 10) ? "0" + s : s;
                                    document.getElementById('show_time_1').innerHTML = H + ":" + i + ":" + s;
                                    setTimeout("show_time_1()", 1000);/* 1 sec */
                                }

                                show_time_1();
                                </script></span></b>
        </a>

                    </a>
                    {% else %}
                        <a href="{% url 'accounts:login' %}">
                            <button class="btn btn-info"
                                    style="margin-right: 8px;">{% translate "Logout" %}</button>
                        </a>
                    {% endif %}
                </li>
            </ul>
        </div>
    </div>
