{% load static %}
{% load i18n %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="Content-Language" content="fa-IR"/>
    <meta name="robots" content="index, follow">
    {#    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>#}
    <meta name="description" content="سامانه یادبود مجازی/یادبود آنلاین/ختم آنلاین/ختم مجازی"/>
    <meta name="keywords" content="برای شادی روح , {{ deveased.title }} , {{ deveased.name }}"/>
    <meta name="author" content="توسعه فناوری و ارتباطات گیلان"/>
    <meta property="og:title" content="{{ deveased.title }} {{ deveased.name }}">
    <meta property="og:description" content="{{ deveased.description }}">
    <meta property="og:image" content="{{ deveased.picture.url }}">
    <meta property="og:url" content="{{ Site }}/{{ deveased.id }}">

    <link rel="stylesheet" href="{% static 'root/bs/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'root/css/basebody.css' %}"/>

    <title>{{ deveased.title }} {{ deveased.name }}</title>
</head>
<body dir="ltr" class="bkg">
<div class="container-fluid">
    <div class="row">
        <div class="col-xl-2 col-sm-2"></div>
        <div class="col-xl-8 col-sm-8">
            <div class="animated rubberBand border"
                 style="background: #000000 ; border-radius: 5px; padding: 15px; color: #ffffff;">
                <div class="row">
                    <div class="col-xl-12 col-sm-12" style=""><img
                            src="{% static 'memorial/pic/ena.jpg' %}" height="90%" width="90%" alt="" class="rounded"
                            style="display: block; margin-left: auto; margin-right: auto; width: 50%;overflow: auto;">
                    </div>
                    <br>
                </div>
                <br>
                <div class="row">
                    <div class="col-xl-1 col-sm-1"></div>
                    <div class="col-xl-10 col-sm-10 rounded border border-secondar"
                         style="text-align: center; background-color:  #423f3e ; padding: 15px 0 20px 0">
                        {{ deveased.title }} {{ deveased.name }}
                    </div>
                    <div class="col-xl-1 col-sm-1"></div>
                </div>
                <div class="row">
                    <div class="col-xl-1 col-sm-1"></div>
                    <div class="col-xl-10 col-sm-10" style="padding: 15px 15px 15px 15px">
                        <img src="{{ deveased.picture.url }}" alt="{{ deveased.name }}" height="80%" width="80%"
                             class="rounded" style="display: block; margin-left: auto; margin-right: auto; width: 60%;overflow: auto">
                    </div>
                    <div class="col-xl-1 col-sm-1"></div>
                </div>
            </div>
            <div class="col-xl-2 col-sm-2"></div>
        </div>
    </div>
</div>

<script src="{% static 'root/bs/js/jquery-3.5.1.min.js' %}"></script>
<script src="{% static 'root/bs/js/popper.min.js' %}"></script>
<script src="{% static 'root/bs/js/bootstrap.min.js' %}"></script>
<br>
{% include 'partials/footer.html' %}
</body>
</html>
