{% extends 'base.html' %}
{% load i18n %}

{% block body %}
    <center>Memorial Main Page</center>
    <div class="container">
        <section class="bg-texture">
            <div class="row">
                <div class="col">
                    <div class="animated rubberBand"
                         style="background: #2c3e50; border-radius: 5px; padding: 20px; color: #ffffff;">
                        <div>
                            <form method="get">
                                {% csrf_token %}
                                <div class="form-group">
                                    {{ form.as_p }}
                                    <button type="submit"
                                            class="btn btn-info btn-block">{% translate "Search" %}</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
{% endblock %}
