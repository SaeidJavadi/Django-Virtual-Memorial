{% load i18n %}
{% load static %}
<div class="row">
    <div class="col-md-3 col-sm-1"></div>
    <div class="col-md-6 col-sm-10" style="margin-top: 10px;">
        <div class="animated rubberBand"
             style="background: #2c3e50; border-radius: 5px; padding: 20px; color: #ffffff;">
            <div>
                <div class="row">
                    <div class="col-xl-2 col-sm-1 col-1"></div>
                    <div class="col-xl-4 col-sm-5 col-5" dir="rtl">
                        <p class="totalshow">{% trans 'Total Salavat:' %}<br>
                            <span style="color: #60ff00 ">{{ data.salavat }}</span>
                        </p>
                    </div>

                    <div class="col-xl-4 col-sm-5 col-5" dir="rtl">
                        <p class="totalshow">{% trans 'Total Fatehe:' %}<br>
                            <span style="color: #60ff00 ">{{ data.fatehe }}</span>
                        </p>
                    </div>
                    <div class="col-xl-2 col-sm-1 col-1"></div>
                </div>
                <br>
                <div class="row">
                    <div class="col-xl-1 col-sm-1"></div>
                    <div class="col-xl-10 col-sm-10">
                        <a href="{% url 'memorial:lists_ziarat' %}" class="btn btn-outline-warning btn-block" style="text-decoration: none">
                            لیست درخواست زیارت های نیابتی
                        </a>
                    </div>
                    <div class="col-xl-1 col-sm-1"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3 col-sm-1"></div>
</div>
